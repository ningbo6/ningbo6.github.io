# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: Ningbo's blogs
subtitle: just for fun
description: A coder who want to be a programmer.
author: Ningbo Yang
language: zh-Hans
timezone: Asia/Shanghai
keywords: ros, ubuntu, TensorFlow, gazebo, rviz, robot, reinforcement learning

# URL
## If your site is put in a subdirectory, set url as 'http://yoursite.com/child' and root as '/child/'
url: https://ningbo6.github.io/
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - README.md
  - 404.html
  - baidu_verify_IIJFGFbbEX.html
  - google005f20e2891088fe.html

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link: true # Open external links in new tab
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace:
  
# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date
  
# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss

# Pagination
per_page: 10
pagination_dir: page

# Extensions
## Plugins: https://hexo.io/plugins/
# Plugins are loaded automatically from package.json

# Server
port: 4000
logger: true
logger_format:

## Themes: https://hexo.io/themes/
theme: next

# Deployment
## Docs: https://hexo.io/docs/deployment.html
deploy:
  type: git
  repo: git@github.com:ningbo6/ningbo6.github.io.git
  branch: master
  name: ningbo6
  email: 365220121@qq.com

#Comment support
duoshuo:
  enable: false
  shortname: your-duoshuo-shortname
#sitemap
sitemap:
  path: sitemap.xml

# Theme Configuration (Next)
# Overrides themes/next/_config.yml
theme_config:
  # Scheme
  #scheme: Muse
  #scheme: Mist
  #scheme: Pisces
  scheme: Gemini

  # Site Information
  favicon:
    small: /images/favicon-16x16-next.png
    medium: /images/favicon-32x32-next.png
    apple_touch_icon: /images/apple-touch-icon-next.png
    safari_pinned_tab: /images/logo.svg
  
  rss: /atom.xml
  
  # Menu
  menu:
    home: / || home
    about: /about/ || user
    tags: /tags/ || tags
    categories: /categories/ || th
    archives: /archives/ || archive
    #schedule: /schedule/ || calendar
    sitemap: /sitemap.xml || sitemap
    #commonweal: /404/ || heartbeat
  
  menu_icons:
    enable: true

  # Sidebar
  sidebar:
    position: left
    display: post
    offset: 12
    b2t: false
    scrollpercent: false
    onmobile: false

  # Social Links
  social:
    GitHub: https://github.com/ningbo6 || github
    E-Mail: mailto:365220121@qq.com || envelope
  
  social_icons:
    enable: true
    icons_only: false
    transition: false

  # Avatar
  #avatar: /images/avatar.gif

  # Toc
  toc:
    enable: true
    number: true
    wrap: false
    
  # Github Banner
  github_banner:
    enable: false
    permalink: https://github.com/ningbo6
    title: Follow me on GitHub

baidu_push: true
